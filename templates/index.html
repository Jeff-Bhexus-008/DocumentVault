{% extends "base.html" %}

{% block title %}
Doxari - Secure Document Storage
{% endblock %}

{% block content %}

<div class="splash-screen" id="splashScreen">

```
<img
    src="{{ url_for('static', filename='logo.png') }}"
    alt="Doxari"
    class="splash-logo"
>
```

</div>

<section class="hero" id="heroContent">

```
<h1>
    Your Documents.
    <br>
    Securely Stored.
</h1>

<p>
    Doxari helps you securely store and manage
    your important documents from anywhere in the world.
</p>
```

</section>

<script>

    window.addEventListener("load", function () {

        const splash = document.getElementById("splashScreen");
        const hero = document.getElementById("heroContent");

        hero.style.display = "none";

        setTimeout(function () {

            splash.classList.add("fade-out");

            setTimeout(function () {

                splash.style.display = "none";
                hero.style.display = "block";

            }, 1000);

        }, 5000);

    });

</script>

{% endblock %}
