{% extends "base.html" %}

{% block title %}Login - DocumentVault{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Login</h1>

    <form method="POST">

        <label for="email">Email address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Your password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="{{ url_for('register') }}">Create one</a>
    </p>

</div>

{% endblock %}
