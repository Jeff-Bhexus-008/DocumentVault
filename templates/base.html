<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}DocumentVault{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <a href="{{ url_for('home') }}" class="logo">
            DocumentVault
        </a>

        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}">Register</a>
        </div>

    </nav>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            &copy; 2026 DocumentVault.
            Secure document storage.
        </p>

    </footer>

</body>

</html>
