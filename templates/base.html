<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Doxari is a secure document storage platform that helps you safely store, organize, and manage your important documents from anywhere in the world."
>

<meta
    name="keywords"
    content="Doxari, secure document storage, document management, online document storage, digital documents"
>

<meta
    name="google-site-verification"
    content="eb67qjTC1iBlsAxhnmdO2b74oMuJ63wglxiSu1m6_6k"
>

<title>
    {% block title %}Doxari - Secure Document Storage{% endblock %}
</title>

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
>
```

</head>

<body>

```
<nav class="navbar">

    <a
        href="{{ url_for('home') }}"
        class="logo"
    >

        <img
            src="{{ url_for('static', filename='logo.png') }}"
            alt="Doxari - Secure Document Storage"
            class="logo-image"
        >

    </a>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('login') }}">
            Login
        </a>

        <a href="{{ url_for('register') }}">
            Register
        </a>

    </div>

</nav>

<main>

    {% block content %}
    {% endblock %}

</main>

<footer>

    <p>
        &copy; 2026 Doxari - Built by Jeff.
        Secure document storage.
    </p>

</footer>
```

</html>
