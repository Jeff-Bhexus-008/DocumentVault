{% extends "base.html" %}

{% block title %}Create Account - DocumentVault{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Create Account</h1>

    <form method="POST">

        <label for="email">Email address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p>
        Already have an account?
        <a href="{{ url_for('login') }}">Login</a>
    </p>

</div>

{% endblock %}
